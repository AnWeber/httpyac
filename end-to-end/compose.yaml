services:
  wiremock:
    image: wiremock/wiremock:3.13.2
    ports:
      - '127.0.0.1:8089:8080'
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings:ro
      - ./wiremock/__files:/home/wiremock/__files:ro
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://localhost:8080/__admin/health']
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
