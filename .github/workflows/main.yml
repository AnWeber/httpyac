name: build
on:
  push:
    branches:
      - main
  pull_request:

env:
  REGISTRY: ghcr.io

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        language: ["javascript"]
        node-version: [24.x]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Run Another Release Please
        uses: ZeroWiggliness/another-release-please-action@v0.2.3
        with:
          command: release,release-pr
          token: ${{ secrets.ARP_TOKEN }}
          target-branch: main
          release-branches: "main,release/v*"
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql-config.yml
      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test -- --coverage
      - name: Build
        run: npm run build -- --no-minify
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
      - run: npm run docker_build
